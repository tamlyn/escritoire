name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    # Build on EL8 so the app and its native modules link against RHEL 8's glibc 2.28.
    container: almalinux:8
    steps:
      - run: dnf install -y git tar gzip which libatomic

      - uses: actions/checkout@v7

      # Node first: pnpm 12's installer runs a script with it.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions

      - uses: pnpm/action-setup@v6

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm exec electron-vite build

      # electron-builder gzips at level 9 by default, which is six times slower
      # than level 5 for an archive no smaller (the bundle is mostly binaries).
      - run: pnpm exec electron-builder --linux --publish never
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: 5

      - name: Check the bundled Claude Code runs on EL8
        run: dist/linux-unpacked/resources/app/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude --version

      # N-API, so plain Node loading it proves the prebuild was packaged and links against glibc 2.28.
      - name: Check the packaged file watcher loads on EL8
        run: node -e "require('./dist/linux-unpacked/resources/app/node_modules/@parcel/watcher')"

      - name: Check the packaged pty spawns a shell on EL8
        run: >-
          node -e "const pty = require('./dist/linux-unpacked/resources/app/node_modules/node-pty');
          const p = pty.spawn('/bin/sh', ['-c', 'echo pty-ok'], {});
          let out = ''; p.onData((d) => (out += d));
          p.onExit(() => process.exit(out.includes('pty-ok') ? 0 : 1))"

      # Unzipped, so the download is the tarball itself rather than a zip of it.
      - uses: actions/upload-artifact@v7
        with:
          path: dist/*.tar.gz
          archive: false

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.tar.gz
